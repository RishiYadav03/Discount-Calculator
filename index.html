<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discount Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url('discount.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="bg-light d-flex justify-content-center align-items-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-11 col-sm-8 col-md-6 col-lg-4">
                <div class="card p-4 shadow rounded-4 bg-black text-white">
                    <h4 class="text-center mb-3">Discount Calculator</h4>
                    
                    <div class="mb-3">
                        <label for="AmountInput" class="form-label">Enter Amount:</label>
                        <input type="number" class="form-control" id="AmountInput" placeholder="e.g. 10000">
                    </div>

                    <div class="mb-3">
                        <label for="DiscountInput" class="form-label">Enter Discount:</label>
                        <input type="number" class="form-control" id="DiscountInput" placeholder="e.g. 7">
                    </div>
            
                    <button id="button" class="btn btn-danger w-100">Convert</button>
            
                    <div class="mt-3 text-center">
                        <p id="errMsg"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="discount.js" type="module"></script>
</body>
</html>
